<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <div
      class="card"
      data-qa="card"
    >
      <img
        class="card_image"
        src="images/imac.jpeg"
        alt="iMac A1419"
      />

      <h2 class="card_title">
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </h2>

      <div class="card_code">Код продукту: 195434</div>

      <div class="card_review-container">
        <div class="stars stars--4">
          <div class="stars_star"></div>

          <div class="stars_star"></div>

          <div class="stars_star"></div>

          <div class="stars_star"></div>
        </div>

        <div class="card_review-count">Відгуків: 5</div>
      </div>

      <div class="card_price-container">
        <div class="card_price-label">Ціна:</div>

        <div class="card_price">2199 доларів США</div>
      </div>

      <a
        class="card_buy"
        href="#"
        data-qa="hover"
      >
        Купити
      </a>
    </div>
  </body>
</html>
